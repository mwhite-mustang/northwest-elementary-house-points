<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwest Elementary House Points</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;aspect-ratio:16/9;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);
background:url('house-scoreboard-v3.jpg') center center/100% 100% no-repeat}
.score{position:absolute;transform:translate(-50%,-50%);width:17%;text-align:center;
font-weight:900;font-size:clamp(42px,6.3vw,110px);line-height:1;color:#fff;
text-shadow:0 5px 2px rgba(0,0,0,.95),0 0 16px rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
#altruismo{left:18.8%;top:47.19%} #amistad{left:50%;top:47.19%} #reveur{left:81.2%;top:47.19%}
#nukumori{left:18.8%;top:81.65%} #onraka{left:50%;top:81.65%} #protos{left:81.2%;top:81.65%}
#status{position:absolute;right:.8%;bottom:.4%;font-size:11px;color:#bbb;background:#000a;padding:4px 8px;border-radius:10px}
</style></head>
<body><div id="wrap"><div id="stage">
<div class="score" id="altruismo">0</div><div class="score" id="amistad">0</div><div class="score" id="reveur">0</div>
<div class="score" id="nukumori">0</div><div class="score" id="onraka">0</div><div class="score" id="protos">0</div>
<div id="status">Connecting…</div></div></div>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTB0LVYIA07xj3L7UQj0hUZlinTTRbNGDS3VNo1gaDQwDWp3KaNEAbq3HWuyyxXDGgCgUDvNwAHPFf0/pub?gid=0&single=true&output=csv';
const ids={"altruismo":"altruismo","amistad":"amistad","rêveur":"reveur","reveur":"reveur","nukumori":"nukumori","onraka":"onraka","protos":"protos"};
function parseCSV(t){return t.trim().split(/\r?\n/).slice(1).map(l=>{let i=l.indexOf(',');return i<0?null:[l.slice(0,i).replace(/^"|"$/g,'').trim(),l.slice(i+1).replace(/^"|"$/g,'').trim()]}).filter(Boolean)}
async function refresh(){try{let r=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();
parseCSV(await r.text()).forEach(([h,p])=>{let id=ids[h.toLowerCase()];if(id)document.getElementById(id).textContent=p||"0"});
document.getElementById("status").textContent="LIVE • "+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})
}catch(e){document.getElementById("status").textContent="Waiting for House Points…"}}
refresh();setInterval(refresh,15000);
</script></body></html>
